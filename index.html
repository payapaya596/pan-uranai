  <meta property="og:type" content="website" />

  <style>
    *{ box-sizing:border-box; }

    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      margin:0;
      padding:24px;
      background:#faf7f2;
    }

    .card{
      max-width:720px;
      margin:0 auto;
      background:#fff;
      border-radius:16px;
      padding:20px;
      box-shadow:0 8px 30px rgba(0,0,0,.06);
    }

    /* 言語切替（タイトルの上・右寄せ・小さめ） */
    .lang-switch{
      text-align:right;
      margin-bottom:8px;
    }

    .lang-switch a{
      text-decoration:none;
      font-weight:600;
      font-size:13px;
      color:#111;
      border:1px solid #ddd;
      padding:4px 8px;
      border-radius:999px;
      background:#fff;
      display:inline-flex;
      align-items:center;
      gap:5px;
    }

    .flag{
      width:16px;
      height:11px;
      display:inline-block;
    }

    h1{
      margin:0 0 8px;
      font-size:28px;
    }

    p{
      margin:0 0 16px;
      line-height:1.6;
    }

    label{
      display:block;
      font-weight:600;
      margin:14px 0 6px;
    }

    input{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid #ddd;
      font-size:16px;
    }

    button{
      margin-top:14px;
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:0;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      background:#111;
      color:#fff;
    }

    .result{
      margin-top:18px;
      padding:16px;
      border-radius:14px;
      background:#fff7ea;
      border:1px solid #f2d7b2;
    }

    .compatibility{
      margin-top:14px;
      padding:10px;
      border-radius:10px;
      background:#fff;
      border:1px dashed #e2c8a6;
      font-size:14px;
    }

    .bread{
      font-size:20px;
      font-weight:800;
      margin-bottom:8px;
    }

    .bread-wrap{
      display:grid;
      grid-template-columns:160px 1fr;
      gap:14px;
      align-items:start;
    }

    .bread-img{
      width:160px;
      height:160px;
      object-fit:contain;
      border-radius:14px;
      background:#fff;
      border:1px solid #f2d7b2;
    }

    @media (max-width:520px){
      .bread-wrap{ grid-template-columns:1fr; }
      .bread-img{ width:100%; height:220px; }
    }
  </style>
</head>

<body>

<div class="card">

  <div class="lang-switch">
    <a href="fr/">
      <img src="images/flags/flag-fr.svg" class="flag" alt="">
      Français
    </a>
  </div>

  <h1>🥐パン占い🥖</h1>

  <p>あなたをフランスのパンに例えて占います。<br>
  誕生日は <b>8桁</b>（例：19940714）で入力してください。</p>

  <label for="bday">誕生日（8桁）</label>
  <input id="bday" inputmode="numeric" placeholder="例：19940714" maxlength="8" />

  <button id="btn">占う🥖</button>

  <div id="out" class="result" style="display:none;"></div>

</div>

<script>
const patterns = [
  {
    bread:"クロワッサン",
    img:"croissant.webp",
    text:`私は重層的。軽やかに見えて、準備は抜かないタイプ。
空気を読むのもわりと得意。
バターみたいに、気づけば周りを惹きつけている。
優雅に見えるが、内側ではかなり計算している。`,
    motto:"相性 ★★★ バゲット・トラディション ／ ☆ パン・オ・ショコラ"
  },
  {
    bread:"パン・オ・ショコラ",
    img:"pain-au-chocolat.webp",
    text:`注目を集める人気者。パンの顔をした甘い奴。

クロワッサンに僻まれる。呼び方ひとつで嵐を巻き起こす。
愛されることには、わりと慣れている。`,
    motto:"相性 ★★★ フラン ／ ☆ クロワッサン"
  },
  {
    bread:"バゲット・トラディション",
    img:"baguette.webp",
    text:`私は余計なものを足さない。小麦と水と塩、それで十分。
派手じゃないけど、気づけば毎日そばにいる。
でも、ときどき真顔で冗談を言う。`,
    motto:"相性 ★★★ ショソン・オ・ポム ／ ☆ ヌテラ・クレープ"
  },
  {
    bread:"カヌレ",
    img:"canele.webp",
    text:`大きくない。でも、だいたい思ったより高い。
外はカリッ、中はモチッ。親しい人にだけ見せるギャップ萌え。
ラムの香りは、わりと本気。`,
    motto:"相性 ★★★ パン・オ・レザン ／ ☆ ヌテラ・クレープ"
  },
  {
    bread:"クグロフ",
    img:"kouglof.webp",
    text:`私は存在感がある。王冠みたいな形。
派手に見えて、わりと落ち着いている。
特別な日は、だいたい私が呼ばれる。`,
    motto:"相性 ★★★ ショソン・オ・ポム ／ ☆ カヌレ"
  },
  {
    bread:"ブリオッシュ",
    img:"brioche.webp",
    text:`私は柔らかい。でも、だいたい贅沢に作られている。
居心地のよさには、わりとこだわる。
雑に扱ったら、ただじゃおかないよ。`,
    motto:"相性 ★★★ クロワッサン ／ ☆ バゲット・トラディション"
  },
  {
    bread:"パン・オ・レザン",
    img:"pain-aux-raisins.webp",
    text:`私はぐるぐる考えて、わりと哲学的。
甘い部分も大人っぽい部分も、どっちも持っている。

    motto:"相性 ★★★ カヌレ ／ ☆ ヌテラ・クレープ"
  },
  {
    bread:"ショソン・オ・ポム",
    img:"chausson-aux-pommes.webp",
    text:`私は包み込むのが得意。甘さも酸味もちゃんと中に入っている。

    motto:"相性 ★★★ クグロフ ／ ☆ クイニーアマン"
  },
  {
    bread:"クイニーアマン",
    img:"kouign-amann.webp",
    text:`私は遠慮しない。バターと砂糖の暴力。

    motto:"相性 ★★★ ヌテラ・クレープ ／ ☆ ショソン・オ・ポム"
  },
  {
    bread:"フラン",
    img:"flan-patissier.webp",
    text:`私はプルプル。気づけばツルっと完食されている。
やさしそうに見えるけど、わりと重量級。

    motto:"相性 ★★★ パン・オ・ショコラ ／ ☆ マドレーヌ"
  },
  {
    bread:"ヌテラ・クレープ",
    img:"nutella-crepe.webp",
    text:`甘さの暴力で、最後は勝つ。

  },
  {
    bread:"マドレーヌ",
    img:"madeleine.webp",
    text:`私は焼き菓子。パン屋にいるのは、たまたま。
小さいけど、育ちはわりといい。
紹介されるまでもないと思っている。`,
    motto:"相性 ★★★ クロワッサン ／ ☆ ヌテラ・クレープ"
  }
];

function hashToIndex(str, mod) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h * 31 + str.charCodeAt(i)) >>> 0;
  }
  return h % mod;
}

document.getElementById("btn").onclick = () => {
  const val = document.getElementById("bday").value;

  if (!/^\d{8}$/.test(val)) {
    alert("8桁の数字で入力してください");
    return;
  }

  const index = hashToIndex(val, patterns.length);
  const result = patterns[index];

  const out = document.getElementById("out");
  out.style.display = "block";

  const imgPath = `images/breads/${result.img}`;

  out.innerHTML = `
    <div class="bread-wrap">
      <img class="bread-img" src="${imgPath}" alt="${result.bread}">
      <div>
        <div class="bread">あなたは「${result.bread}」タイプ</div>
        <div>${result.text.replaceAll("\n","<br>")}</div>
        <div class="compatibility">${result.motto}</div>
      </div>
    </div>
  `;
};
</script>

</body>
</html>
