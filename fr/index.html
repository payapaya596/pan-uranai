<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🥐 Quel pain êtes-vous ? 🥖</title>

<style>

*{box-sizing:border-box;}

body{
font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
margin:0;
padding:24px;
background:#faf7f2;
}

.card{
max-width:720px;
margin:0 auto;
background:#fff;
border-radius:16px;
padding:20px;
box-shadow:0 8px 30px rgba(0,0,0,.06);
}

input{
width:100%;
padding:12px 14px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
}

button{
margin-top:14px;
width:100%;
padding:12px;
border-radius:12px;
border:0;
font-weight:700;
background:#111;
color:#fff;
cursor:pointer;
}

.flag{
width:18px;
height:12px;
vertical-align:-2px;
margin-right:6px;
}

</style>
</head>

<body>

<div class="card">

<p style="text-align:right;">
<a href="../" style="text-decoration:none;font-weight:600;">
<img src="../images/flags/flag-ja.svg" class="flag" alt="日本語">
日本語
</a>
</p>

<h1>🥐 Quel pain êtes-vous ? 🥖</h1>

<p>
Entrez votre date de naissance (8 chiffres).<br>
Exemple : <b>19940714</b>
</p>

<input placeholder="19940714" maxlength="8">

<button>Voir mon pain</button>

</div>

</body>
</html>
